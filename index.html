<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Островок"><meta name="theme-color" content="#123f5e"></head><body>
<title>Островок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen portrait game — status strip on top, pixel-art map in the middle, card tray in the thumb zone. One committed sea-and-sand look (no theme switch). */
:root{
  --sea:#1d5f8a; --sea-deep:#123f5e; --sand:#e9d29b; --paper:#fbf3df; --ink:#2b2418;
  --ink-soft:#6f6450; --accent:#e4572e; --good:#2f9e5b; --panel:#fff8ea; --line:#d8c7a0;
  --g-fields:#d9a521; --g-woods:#3f8a4c; --g-trade:#b5523b; --g-sea:#2f7fb8;
  --f-ui:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sea-deep);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:flex;flex-direction:column;gap:6px;padding:10px 16px 8px;background:var(--panel);border-bottom:3px solid var(--line);z-index:2}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stage{font-weight:800;font-size:18px;line-height:1.1;min-width:0}
.stage small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.pills{display:flex;gap:6px;flex-shrink:0}
.pill{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 9px}
.pill.season{font-size:12px}
.bar{position:relative;height:18px;border-radius:9px;background:#efe2c2;overflow:hidden;border:2px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--good),#5cc27f);transition:width .35s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.relics{display:flex;gap:4px;flex-wrap:wrap;min-height:0}
.relics button{font-size:16px;width:30px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:#fff;padding:0}
.map{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(255,248,234,.95);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:0 2px 0 rgba(0,0,0,.18);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.zoomers{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.zoomers button{width:40px;height:40px;border-radius:12px;font-size:20px}
.tray{background:var(--panel);border-top:3px solid var(--line);padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:2}
.cons{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-soft);font-weight:700;min-height:0}
.cons button{display:flex;gap:4px;align-items:center;padding:4px 9px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:13px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:2px solid var(--line);background:#fff;min-width:0;text-align:center}
.card .em{font-size:28px;line-height:1.1}
.card .nm{font-size:12.5px;font-weight:700;line-height:1.15;min-height:2.3em;display:flex;align-items:center}
.card .gd{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(228,87,46,.25);transform:translateY(-3px)}
.card .info{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.actions{display:flex;gap:8px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{flex:1;min-height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.btn.primary{background:var(--accent);border-color:#b8401d;color:#fff}
.btn.on{background:#ffe3d6;border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn .n{font-variant-numeric:tabular-nums;background:var(--paper);border-radius:999px;padding:1px 7px;font-size:12px}
.btn.primary .n{background:rgba(255,255,255,.25)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ov{position:absolute;inset:0;background:rgba(10,32,50,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.sheet{background:var(--panel);border-radius:20px;border:3px solid var(--line);padding:20px 18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.sheet h2{margin:0;font-size:23px;font-weight:800;text-wrap:balance}
.sheet p{margin:0;line-height:1.45;color:var(--ink-soft);font-size:14.5px}
.logo{font-size:46px;font-weight:800;line-height:1}
.logo em{font-style:normal;color:var(--accent)}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.meta span{font-size:12.5px;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.rules{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.rules li b{flex:0 0 24px;height:24px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:13px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:13.5px;line-height:1.35}
.choice .em{font-size:26px;flex-shrink:0}
.choice strong{display:block;font-size:15px}
.choice .price{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0}
.choice.picked{border-color:var(--accent);background:#fff1ea}
.choice:disabled{opacity:.45}
.guilds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gcard{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;border:3px solid var(--line);background:#fff;text-align:left;font-size:12.5px;line-height:1.35;color:var(--ink-soft)}
.gcard strong{font-size:16px;color:var(--ink)}
.gcard .ems{font-size:20px;letter-spacing:2px}
.gcard.picked{border-color:var(--accent);background:#fff1ea}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.stat span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.tip .head{display:flex;gap:10px;align-items:center}
.tip .em{font-size:34px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#fff;padding:2px 8px;border-radius:999px;align-self:flex-start}
.btnrow{display:flex;gap:8px}
.toast{position:absolute;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;z-index:6;pointer-events:none;white-space:nowrap}
.bar b{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(45deg,rgba(47,158,91,.32) 0 6px,rgba(47,158,91,.14) 6px 12px);transition:width .35s}
.lv{display:flex;gap:3px}.lv i{width:14px;height:14px;border-radius:3px;background:#e6d6b0;border:1.5px solid #cdb788}
.lv i.on{background:#ffd34d;border-color:#d9a521;box-shadow:0 0 6px rgba(255,200,60,.8)}
.gp{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:14px;border:2px solid var(--line);background:#fff}
.gp .shield{flex:0 0 50px;height:58px;border-radius:10px 10px 25px 25px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),inset 0 0 0 3px rgba(255,255,255,.25)}
.gp.locked{background:#f3ead6}.gp.locked .shield{background:#a39b8a;filter:grayscale(1)}
.gp .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.gp .ttl{display:flex;justify-content:space-between;align-items:center;gap:8px}.gp .ttl strong{font-size:16px}
.gp small,.rank span{color:var(--ink-soft);font-size:12px;font-weight:700;line-height:1.3}
.gp .bl{font-size:19px;letter-spacing:1px}.gp .bl .q{opacity:.4;filter:grayscale(1)}
.xp{position:relative;height:10px;border-radius:5px;background:#efe2c2;overflow:hidden;border:1.5px solid var(--line)}
.xp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#d9a521,#ffd34d);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:3px 0}.segs i{height:11px;border-radius:3px;background:#efe2c2;border:1.5px solid var(--line)}.segs i.on{background:#ffd34d;border-color:#d9a521}
.rank{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px}
.rank .num{flex:0 0 42px;height:42px;border-radius:50%;background:#7a4a24;color:#ffd34d;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;border:3px solid #d9a521}
.rank b{font-size:16px;display:block}
.score{display:flex;flex-direction:column;gap:5px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.score div{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}.score div b{color:var(--good);white-space:nowrap}
.score .tot{border-top:2px dashed var(--line);padding-top:7px;margin-top:2px;font-weight:800;font-size:16px}
.skills{display:flex;flex-direction:column;gap:8px}
.skill{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:13px;line-height:1.35;color:var(--ink-soft)}
.skill strong{display:block;color:var(--ink);font-size:15px}.skill .em{font-size:26px;flex-shrink:0}.skill.locked{opacity:.5}
.skill .pts{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.skill .pts .btn{flex:none;min-height:34px;padding:0 14px;font-size:18px}
.gcard:disabled{opacity:.6;filter:grayscale(.85);cursor:default}.gcard .lk{font-weight:700;color:var(--accent)}
.unl{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 14px;border-radius:16px;background:linear-gradient(#c99463,#a56c3c);color:#fff;text-align:center;border:3px solid #7a4a24;box-shadow:inset 0 0 0 3px rgba(255,255,255,.15)}
.unl .big{font-size:60px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25));animation:pop .5s}
.unl h3{margin:0;font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.unl p{color:#3a2a18;background:#fbf0d6;border-radius:10px;padding:10px 12px;margin:0;text-align:left;width:100%;box-sizing:border-box;font-size:14px;line-height:1.4}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
#menuBtn{font-size:16px;padding:3px 10px;cursor:pointer}
.quest{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-soft);line-height:1.25}
.quest .qb{flex-shrink:0;font-variant-numeric:tabular-nums;background:#fff;border:2px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink)}
.quest.done{color:var(--good)}.quest.done .qb{border-color:var(--good)}
.coach{position:absolute;left:12px;right:12px;z-index:4;background:#2b2418;color:#fbf3df;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px;animation:pop .35s}
.coach{pointer-events:none}.coach .btn{pointer-events:auto}
.coach.top{top:56px}.coach{font-size:13.5px}
.adbox{aspect-ratio:16/9;border-radius:14px;background:repeating-linear-gradient(45deg,#26323d 0 14px,#2d3b48 14px 28px);color:#cfd8e0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:14px;padding:12px}
.plus{background:linear-gradient(135deg,#fff3c9,#ffe08a);border-color:#d9a521}.coach.bot{bottom:12px}
.coach b{color:#ffd34d}.coach .btn{flex:none;min-height:36px;align-self:flex-end;padding:0 16px;background:#ffd34d;border-color:#d9a521}
.coach .stp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#bfb29a;font-weight:700}
.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(228,87,46,.55)}50%{box-shadow:0 0 0 7px rgba(228,87,46,0)}}
.achs{display:flex;flex-direction:column;gap:6px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink-soft);line-height:1.3}
.ach strong{display:block;font-size:14.5px;color:var(--ink)}.ach .em{font-size:24px;width:30px;text-align:center;flex-shrink:0}
.ach.off{background:#f3ead6}.ach.off .em{filter:grayscale(1);opacity:.45}.ach .rw{margin-left:auto;font-weight:800;color:var(--good);flex-shrink:0}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.zoomers .btn.on{background:#ffe3d6}
@media (prefers-reduced-motion:reduce){.bar i,.bar b,.xp i{transition:none}.card.sel{transform:none}.unl .big{animation:none}}
</style>

<div id="app">
  <div class="top">
    <div class="row">
      <div class="stage" id="stageName">Стоянка<small id="stageNum">этап 1 из 8</small></div>
      <div class="pills">
        <button class="pill" id="menuBtn" aria-label="Меню">☰</button>
        <span class="pill season" id="season">🌸 Весна</span>
        <span class="pill" title="Монеты">💰 <b id="coins">0</b></span>
        <span class="pill" title="Недель осталось">⏳ <b id="weeks">8</b></span>
      </div>
    </div>
    <div class="bar" title="Штриховка — прогноз до конца этапа при текущем доходе"><b id="barProj"></b><i id="barFill"></i><span id="barText">0 / 200</span></div>
    <div class="quest" id="quest"></div>
    <div class="relics" id="relics"></div>
  </div>
  <div class="map" id="mapWrap">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">Выберите здание внизу</div>
    <div id="coach"></div>
    <div class="zoomers">
      <button class="btn" id="zNum" aria-label="Очки зданий на карте" title="Очки зданий на карте">🔢</button>
      <button class="btn" id="zIn" aria-label="Приблизить">+</button>
      <button class="btn" id="zOut" aria-label="Отдалить">−</button>
    </div>
  </div>
  <div class="tray">
    <div class="cons" id="cons"></div>
    <div class="cards" id="cards"></div>
    <div class="actions" id="actions"></div>
  </div>
  <div id="overlay"></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
(() => {
'use strict';
// =============== CONTENT ===============
const STAGES=[['Стоянка',200],['Хутор',600],['Деревня',1300],['Посёлок',2400],['Городок',4000],['Город',6500],['Портовый город',10000],['Столица',15000]];
const WEEKS=8;
const SEASONS=[{n:'Весна',em:'🌸',d:'цветы считаются за два'},{n:'Лето',em:'☀️',d:'здания Моря ×1,5'},{n:'Осень',em:'🍂',d:'здания Полей ×1,5'},{n:'Зима',em:'❄️',d:'здания Лесов ×1,5'}];
const GUILD={
  fields:{name:'Поля',color:'#d9a521',roof:'#c0392b',d:'Поля, колодцы и пасеки. Растут вместе: чем больше полей рядом, тем лучше.'},
  woods:{name:'Леса',color:'#3f8a4c',roof:'#5a3a22',d:'Очки за деревья и цветы. Хорошо там, где густой лес.'},
  trade:{name:'Торговля',color:'#b5523b',roof:'#7b2d8b',d:'Монеты и очки за плотную застройку любых зданий.'},
  sea:{name:'Море',color:'#2f7fb8',roof:'#1f4e79',d:'Строится на берегу. Очки за воду, песок и другие морские здания.'}
};
const B={
  field:{n:'Пшеничное поле',em:'🌾',g:'fields',on:'land',r:1,likes:['field'],food:1,t:'Каждую неделю: 5 очков и +5 за каждое соседнее поле.'},
  well:{n:'Колодец',em:'⛲',g:'fields',on:'any',r:1,likes:['field'],t:'Пассивно: соседние поля приносят ×2.'},
  mill:{n:'Мельница',em:'🌬️',g:'fields',on:'land',r:2,likes:['field'],t:'Каждую неделю: +8 за каждое поле в радиусе 2.'},
  apiary:{n:'Пасека',em:'🐝',g:'fields',on:'land',r:2,likes:['flower'],food:1,t:'При постройке: +15 за каждый цветок в радиусе 2. Каждую неделю: +4 за цветок.'},
  barn:{n:'Амбар',em:'🏚️',g:'fields',on:'land',r:0,likes:['g:fields'],t:'Каждую неделю: +3 за каждое здание Полей на всём острове.'},
  scarecrow:{n:'Пугало',em:'👒',g:'fields',on:'land',r:1,likes:['field'],t:'Каждую неделю: +7 за каждое соседнее поле.'},
  lodge:{n:'Хижина лесника',em:'🏡',g:'woods',on:'land',r:2,likes:['tree'],t:'Каждую неделю: +6 за каждое дерево в радиусе 2.'},
  sawmill:{n:'Лесопилка',em:'🔨',g:'woods',on:'any',r:1,likes:['tree'],t:'Раз в 2 недели: +18 за каждое соседнее дерево.'},
  herbalist:{n:'Травница',em:'🌿',g:'woods',on:'land',r:2,likes:['flower'],t:'При постройке: +20 за каждый цветок в радиусе 2. Каждую неделю: +3 за цветок.'},
  nursery:{n:'Питомник',em:'🌱',g:'woods',on:'land',r:1,likes:['tree'],t:'При постройке сажает до 2 деревьев рядом. Каждую неделю: +4 за соседнее дерево.'},
  tower:{n:'Охотничья вышка',em:'🦌',g:'woods',on:'land',r:3,likes:['tree'],t:'Каждую неделю: +4 за каждое дерево в радиусе 3.'},
  grove:{n:'Священная роща',em:'🍃',g:'woods',on:'land',r:1,likes:['tree','flower'],t:'Каждую неделю: +10 за соседнее дерево, ×2 если рядом цветок.'},
  market:{n:'Рынок',em:'🏪',g:'trade',on:'any',r:1,likes:['building'],t:'Каждую неделю: +5 за каждое соседнее здание.'},
  tavern:{n:'Таверна',em:'🍺',g:'trade',on:'any',r:1,likes:['food'],t:'Каждую неделю: 1 монета и +8 за каждое соседнее здание с едой (поле, пасека, лодка, солеварня).'},

function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

const idx=(x,y)=>y*W+x, xy=i=>[i%W,(i/W)|0], inMap=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
function around(i,r){const [x,y]=xy(i),o=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(!dx&&!dy)continue;if(Math.abs(dx)+Math.abs(dy)>r)continue;const nx=x+dx,ny=y+dy;if(inMap(nx,ny))o.push(idx(nx,ny))}return o}

function genMap(seed){
  for(let a=0;a<60;a++){
    const r=rng(seed+a*7919),G=5,g=[];for(let i=0;i<(G+1)*(G+1);i++)g.push(r());
    const val=(x,y)=>{const gx=x/(W-1)*G,gy=y/(H-1)*G,ix=Math.min(G-1,gx|0),iy=Math.min(G-1,gy|0),fx=gx-ix,fy=gy-iy,s=t=>t*t*(3-2*t);
      const p=g[iy*(G+1)+ix],q=g[iy*(G+1)+ix+1],u=g[(iy+1)*(G+1)+ix],v=g[(iy+1)*(G+1)+ix+1];const top=p+(q-p)*s(fx),bot=u+(v-u)*s(fx);return top+(bot-top)*s(fy)};
    const terr=new Array(W*H).fill('sea');
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const ex=(x-(W-1)/2)/(W/2),ey=(y-(H-1)/2)/(H/2),d=Math.hypot(ex,ey);if(val(x,y)*0.8+0.55-d*0.85>0.33)terr[idx(x,y)]='land'}
    for(let i=0;i<W*H;i++){const [x,y]=xy(i);if(!x||!y||x===W-1||y===H-1)terr[i]='sea'}
    const land=terr.filter(t=>t==='land').length;if(land<88||land>134)continue;
    // single island: flood fill largest component
    const seen=new Set();let best=[];for(let i=0;i<W*H;i++){if(terr[i]!=='land'||seen.has(i))continue;const st=[i],comp=[];seen.add(i);while(st.length){const c=st.pop();comp.push(c);for(const j of around(c,1))if(terr[j]==='land'&&!seen.has(j)){seen.add(j);st.push(j)}}if(comp.length>best.length)best=comp}
    if(best.length<land*0.85)continue;
    const keep=new Set(best);for(let i=0;i<W*H;i++)if(terr[i]==='land'&&!keep.has(i))terr[i]='sea';
    for(let i=0;i<W*H;i++)if(terr[i]==='land'&&around(i,1).some(j=>terr[j]==='sea'))terr[i]='sand';
    for(let i=0;i<W*H;i++)if(terr[i]==='land')terr[i]='meadow';
    const obj=new Array(W*H).fill(null),r2=rng(seed*31+a),G2=[];for(let i=0;i<36;i++)G2.push(r2());
    for(let i=0;i<W*H;i++){const t=terr[i];if(t==='sea')continue;const [x,y]=xy(i),fz=G2[((y/H*6)|0)*6+((x/W*6)|0)],q=r2();
      if(t==='meadow'){if(fz>0.42&&q<0.66)obj[i]={k:'tree'};else if(q<0.05)obj[i]={k:'rock'};else if(q<0.2)obj[i]={k:'flower'}}
      else if(q<0.08)obj[i]={k:'rock'}}
    return {terr,obj};
  }
  return genMap(seed+13);
}

// =============== RULES ===============
const seasonOf=st=>((st.stage/2)|0)%4;
function isK(st,i,k){const o=st.obj[i];
  if(k==='sea')return st.terr[i]==='sea'; if(k==='sand')return st.terr[i]==='sand'&&!(o&&B[o.k]);
  if(!o)return false;
  if(k==='tree'||k==='rock'||k==='flower'||k==='field')return o.k===k;
  if(k==='building')return !!B[o.k]; if(k==='food')return !!(B[o.k]&&B[o.k].food);
  if(k.startsWith('g:'))return !!(B[o.k]&&B[o.k].g===k.slice(2));
  return false}
const cnt=(st,i,r,k)=>around(i,r).filter(j=>isK(st,j,k));
const coast=(st,i)=>around(i,1).some(j=>st.terr[j]==='sea');
function canPlace(st,k,i){if(i<0||st.obj[i])return false;const t=st.terr[i];if(t==='sea')return false;const on=B[k].on;
  if(on==='coast')return coast(st,i); if(on==='land')return t==='meadow'; return true}
const flowerW=st=>(seasonOf(st)===0||S.relics.includes('can'))?2:1;
function guildMult(g){let m=1;const s=seasonOf(S);if((s===1&&g==='sea')||(s===2&&g==='fields')||(s===3&&g==='woods'))m*=1.5;
  if((g==='fields'&&S.relics.includes('sickle'))||(g==='woods'&&S.relics.includes('axe'))||(g==='trade'&&S.relics.includes('scales'))||(g==='sea'&&S.relics.includes('net')))m*=1.25;
  if(S.gl&&S.gl[g]>=5)m*=1.1; m*=Math.pow(1.05,sk('combo'));return m}

function weekly(st,i,wk){
  const o=st.obj[i],k=o.k,fw=flowerW(st);let p=0,tg=[];
  const L=(r,kind,per)=>{const c=cnt(st,i,r,kind);tg=tg.concat(c);return c.length*per};
  switch(k){
    case 'field':{p=(5+L(1,'field',5))*(around(i,1).some(j=>st.obj[j]&&st.obj[j].k==='well')?2:1);break}
    case 'mill':p=L(2,'field',8);break;
    case 'apiary':p=L(2,'flower',4*fw);break;
    case 'barn':{for(let j=0;j<W*H;j++)if(isK(st,j,'g:fields'))tg.push(j);p=3*tg.length;break}
    case 'scarecrow':p=L(1,'field',7);break;
    case 'lodge':p=L(2,'tree',6);break;
    case 'sawmill':{const c=L(1,'tree',18);p=((wk-o.born)%2===1)?c:0;break}
    case 'herbalist':p=L(2,'flower',3*fw);break;
    case 'nursery':p=L(1,'tree',4);break;
    case 'tower':p=L(3,'tree',4);break;
    case 'grove':{const t=L(1,'tree',10);const f=cnt(st,i,1,'flower');tg=tg.concat(f);p=t*(f.length?2:1);break}
    case 'market':p=L(1,'building',5);break;
    case 'tavern':p=L(1,'food',8);break;
    case 'caravan':p=L(3,'building',2);break;
    case 'bank':p=Math.min(90,3*S.coins);break;
    case 'fair':{const c=L(2,'building',14);p=((wk-o.born)%3===2)?c:0;break}
    case 'fishboat':p=L(1,'sea',6);break;
    case 'pier':p=L(2,'g:sea',7);break;
    case 'lighthouse':p=L(2,'sea',3);break;
    case 'shipyard':p=L(2,'tree',4)+L(1,'g:sea',5);break;
    case 'saltworks':p=L(1,'sand',6);break;
    case 'pearl':p=L(1,'sea',4);break;
  }
  if(k!=='warehouse'&&k!=='well'){const wh=around(i,1).filter(j=>st.obj[j]&&st.obj[j].k==='warehouse');p+=4*wh.length}
  p*=guildMult(B[k].g)*(o.up?1.5:1);
  return {pts:Math.round(p),tg};
}
function onBuild(st,k,i){let pts=0,coins=0;const fw=flowerW(st);
  if(k==='apiary')pts=15*fw*cnt(st,i,2,'flower').length;
  if(k==='herbalist')pts=20*fw*cnt(st,i,2,'flower').length;
  if(k==='pearl')coins=cnt(st,i,1,'sea').length;
  return {pts:Math.round(pts*guildMult(B[k].g)),coins}}
function weekTotal(st,wk){let s=0;for(let i=0;i<W*H;i++){const o=st.obj[i];if(o&&B[o.k])s+=weekly(st,i,wk).pts}return s}
const cloneSt=st=>({terr:st.terr,obj:st.obj.map(o=>o?{...o}:null)});
function plant(st,i,r,n,kind){const sp=(i>=0?around(i,1):[...Array(W*H).keys()]).filter(j=>st.terr[j]==='meadow'&&!st.obj[j]),out=[];
  while(sp.length&&out.length<n){const j=sp.splice((r()*sp.length)|0,1)[0];st.obj[j]={k:kind};out.push(j)}return out}
function preview(k,i){
  const wk=S.week+1,before=weekTotal(S,wk),st=cloneSt(S);
  st.obj[i]={k,born:S.week,id:0};
  if(k==='nursery')plant(st,i,rng(i*977+S.week),2,'tree');
  const after=weekTotal(st,wk),ob=onBuild(st,k,i),own=weekly(st,i,wk+(k==='sawmill'?1:0));
  const changed=[];for(let j=0;j<W*H;j++){const o=S.obj[j];if(j===i||!o||!B[o.k])continue;const a=weekly(S,j,wk).pts,b=weekly(st,j,wk).pts;if(a!==b)changed.push([j,b-a])}
  return {gain:after-before+ob.pts,own,changed,st,coins:ob.coins};
}

const ptrs=new Map();let gest=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);audio();ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY,sx:e.offsetX,sy:e.offsetY,t:performance.now()});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];gest={pinch:true,d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:cam.s,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,ox:cam.x,oy:cam.y}}else gest={ox:cam.x,oy:cam.y,moved:false}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse'&&ui.sel>=0&&!ui.busy){const t=tileAt(e.offsetX,e.offsetY);if(t!==ui.cursor){ui.cursor=t;renderUI()}}return}
  p.x=e.offsetX;p.y=e.offsetY;
  if(gest&&gest.pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];zoomTo(gest.s*Math.hypot(a.x-b.x,a.y-b.y)/gest.d,gest);return}
  if(gest&&!gest.pinch){const dx=p.x-p.sx,dy=p.y-p.sy;if(Math.hypot(dx,dy)>8)gest.moved=true;if(gest.moved){cam.x=gest.ox+dx;cam.y=gest.oy+dy;clampCam()}}});
function endP(e){const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);if(!p)return;if(gest&&gest.pinch){if(!ptrs.size)gest=null;return}
  if(gest&&!gest.moved&&performance.now()-p.t<500)tap(p.x,p.y);if(!ptrs.size)gest=null}
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
cv.addEventListener('wheel',e=>{e.preventDefault();const [wx,wy]=toWorld(e.offsetX,e.offsetY);zoomTo(cam.s*(e.deltaY<0?1.12:1/1.12),{cx:e.offsetX,cy:e.offsetY,ox:cam.x,oy:cam.y,s:cam.s})},{passive:false});
function zoomTo(ns,g){const min=Math.min(vw/(W*T),vh/(H*T))*.9,max=min*3.4;ns=Math.max(min,Math.min(max,ns));const wx=(g.cx-g.ox)/g.s,wy=(g.cy-g.oy)/g.s;cam.s=ns;cam.x=g.cx-wx*ns;cam.y=g.cy-wy*ns;clampCam()}
function clampCam(){const mw=W*T*cam.s,mh=H*T*cam.s,pad=60;cam.x=mw<vw?(vw-mw)/2:Math.min(pad,Math.max(vw-mw-pad,cam.x));cam.y=mh<vh?(vh-mh)/2:Math.min(pad,Math.max(vh-mh-pad,cam.y))}

$('zOut').onclick=()=>zoomTo(cam.s/1.25,{cx:vw/2,cy:vh/2,ox:cam.x,oy:cam.y,s:cam.s});
function tap(x,y){if(!S)return;if(ui.busy){ui.fast=true;renderUI();return}
  const t=tileAt(x,y);if(t<0)return;
  if(ui.removing){if(S.obj[t]&&S.removes>0){S.removes--;S.obj[t]=null;ui.removing=false;dust(t);sfx('build');floatAt(t,'снесено','#ffd34d');save();renderUI()}return}
  if(ui.sel>=0){if(ui.cursor===t&&canPlace(S,S.offer[ui.sel],t))return place();ui.cursor=t;sfx('click');renderUI();return}
  const o=S.obj[t];if(o&&B[o.k])showTip(o.k)}
document.addEventListener('keydown',e=>{if(e.key===' '&&ui.busy){ui.fast=true;renderUI();e.preventDefault()}if(e.key==='Escape'){ui.sel=-1;ui.cursor=-1;ui.removing=false;renderUI()}});

// =============== BOOT ===============
new ResizeObserver(()=>{resize();if(S)clampCam()}).observe(wrap);resize();requestAnimationFrame(loop);
window.claude?.hot?.snapshot?.(()=>({S}));
const boot=d=>{if(d&&d.S&&d.S.v===2){S=fixSave(d.S);ui.shown=S.score;R=rng((S.rngSeed+S.week*7919)>>>0);buildTerrain();centerCamera();renderUI()}else showMenu()};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
